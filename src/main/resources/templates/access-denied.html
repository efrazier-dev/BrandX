<!DOCTYPE html>
<!--
  403. Distinct from not-found.html on purpose: "you may not do that" and "there is no
  such thing" are different answers, and conflating them would tell an unauthorized user
  that the record does not exist.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Not permitted')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('')}"></header>

<main class="container">
    <div class="page-head">
        <h1>Not permitted</h1>
    </div>

    <div class="panel">
        <p style="margin-top:0">
            Your account does not have permission to do that.
        </p>
        <p class="muted">
            Signed in as <strong sec:authentication="name">someone</strong>. An administrator
            can change what this account is allowed to do.
        </p>
        <div class="form-actions">
            <a class="btn btn-primary" th:href="@{/}">Back to dashboard</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
