<!DOCTYPE html>
<!-- Serves both create and edit; the mode is decided by whether the bound product has an id. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${product.id} == null ? 'New product' : 'Edit product')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('products')}"></header>

<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">
    <p class="crumb"><a th:href="@{/products}">Products</a> /
        <span th:text="${product.id} == null ? 'New' : ${product.sku}">New</span></p>
    <div class="page-head">
        <h1 th:text="${product.id} == null ? 'New product' : 'Edit product'">New product</h1>
    </div>

    <form method="post" th:object="${product}"
          th:action="${product.id} == null ? @{/products} : @{/products/{id}(id=${product.id})}">
        <!--
          Round-trips the id so the form knows it is in edit mode when re-rendered
          after a validation failure. The server trusts the path variable, not this.
        -->
        <input type="hidden" th:field="*{id}">

        <div class="panel">
            <h2>Details</h2>

            <div class="field-row">
                <div class="field" th:classappend="${#fields.hasErrors('sku')} ? 'has-error'">
                    <label for="sku">SKU</label>
                    <input type="text" id="sku" th:field="*{sku}" placeholder="BX-WIDGET-01">
                    <p class="field-error" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></p>
                    <p class="hint" th:unless="${#fields.hasErrors('sku')}">Must be unique across all products.</p>
                </div>

                <div class="field" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                    <label for="name">Name</label>
                    <input type="text" id="name" th:field="*{name}">
                    <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>
            </div>

            <div class="field" th:classappend="${#fields.hasErrors('description')} ? 'has-error'">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}"></textarea>
                <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
            </div>

            <div class="field-row">
                <div class="field" th:classappend="${#fields.hasErrors('price')} ? 'has-error'">
                    <label for="price">Price</label>
                    <input type="number" id="price" step="0.01" min="0" th:field="*{price}">
                    <p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
                </div>

                <div class="field" th:classappend="${#fields.hasErrors('stockQuantity')} ? 'has-error'">
                    <label for="stockQuantity">Stock quantity</label>
                    <input type="number" id="stockQuantity" min="0" th:field="*{stockQuantity}">
                    <p class="field-error" th:if="${#fields.hasErrors('stockQuantity')}"
                       th:errors="*{stockQuantity}"></p>
                </div>
            </div>

            <div class="field">
                <div class="check">
                    <input type="checkbox" id="active" th:field="*{active}">
                    <label for="active" style="margin:0">Active</label>
                </div>
                <p class="hint">Only active products can be added to new order lines.</p>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary"
                    th:text="${product.id} == null ? 'Create product' : 'Save changes'">Create product
            </button>
            <a class="btn btn-quiet"
               th:href="${product.id} == null ? @{/products} : @{/products/{id}(id=${product.id})}">Cancel</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
