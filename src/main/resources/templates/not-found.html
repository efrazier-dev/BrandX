<!DOCTYPE html>
<!-- Rendered by GlobalExceptionHandler for NotFoundException, with a 404 status. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Not found')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('')}"></header>

<main class="container">
    <div class="page-head">
        <h1>Not found</h1>
    </div>
    <div class="panel">
        <p th:text="${message}">That record does not exist.</p>
        <a class="btn" th:href="@{/}">Back to dashboard</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
