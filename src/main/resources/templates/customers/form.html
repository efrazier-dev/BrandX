<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${customer.id} == null ? 'New customer' : 'Edit customer')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('customers')}"></header>

<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">
    <p class="crumb"><a th:href="@{/customers}">Customers</a> /
        <span th:text="${customer.id} == null ? 'New' : ${customer.fullName}">New</span></p>
    <div class="page-head">
        <div class="page-title">
            <span th:replace="~{fragments/layout :: badge-customer}"></span>
            <h1 th:text="${customer.id} == null ? 'New customer' : 'Edit customer'">New customer</h1>
        </div>
    </div>

    <form method="post" th:object="${customer}"
          th:action="${customer.id} == null ? @{/customers} : @{/customers/{id}(id=${customer.id})}">
        <input type="hidden" th:field="*{id}">

        <div class="panel">
            <h2>Contact</h2>

            <div class="field-row">
                <div class="field" th:classappend="${#fields.hasErrors('firstName')} ? 'has-error'">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" th:field="*{firstName}">
                    <p class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
                </div>

                <div class="field" th:classappend="${#fields.hasErrors('lastName')} ? 'has-error'">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" th:field="*{lastName}">
                    <p class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
                </div>
            </div>

            <div class="field-row">
                <div class="field" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}">
                    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    <p class="hint" th:unless="${#fields.hasErrors('email')}">Must be unique across all customers.</p>
                </div>

                <div class="field" th:classappend="${#fields.hasErrors('phone')} ? 'has-error'">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" th:field="*{phone}">
                    <p class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                </div>
            </div>
        </div>

        <!-- Address is an @Embeddable, so it binds as a nested path: address.line1 etc. -->
        <div class="panel">
            <h2>Address</h2>

            <div class="field" th:classappend="${#fields.hasErrors('address.line1')} ? 'has-error'">
                <label for="line1">Address line 1</label>
                <input type="text" id="line1" th:field="*{address.line1}">
                <p class="field-error" th:if="${#fields.hasErrors('address.line1')}" th:errors="*{address.line1}"></p>
            </div>

            <div class="field" th:classappend="${#fields.hasErrors('address.line2')} ? 'has-error'">
                <label for="line2">Address line 2</label>
                <input type="text" id="line2" th:field="*{address.line2}">
                <p class="field-error" th:if="${#fields.hasErrors('address.line2')}" th:errors="*{address.line2}"></p>
            </div>

            <div class="field-row">
                <div class="field" th:classappend="${#fields.hasErrors('address.city')} ? 'has-error'">
                    <label for="city">City</label>
                    <input type="text" id="city" th:field="*{address.city}">
                    <p class="field-error" th:if="${#fields.hasErrors('address.city')}" th:errors="*{address.city}"></p>
                </div>

                <div class="field" th:classappend="${#fields.hasErrors('address.state')} ? 'has-error'">
                    <label for="state">State / region</label>
                    <input type="text" id="state" th:field="*{address.state}">
                    <p class="field-error" th:if="${#fields.hasErrors('address.state')}"
                       th:errors="*{address.state}"></p>
                </div>

                <div class="field" th:classappend="${#fields.hasErrors('address.postalCode')} ? 'has-error'">
                    <label for="postalCode">Postal code</label>
                    <input type="text" id="postalCode" th:field="*{address.postalCode}">
                    <p class="field-error" th:if="${#fields.hasErrors('address.postalCode')}"
                       th:errors="*{address.postalCode}"></p>
                </div>

                <div class="field" th:classappend="${#fields.hasErrors('address.country')} ? 'has-error'">
                    <label for="country">Country</label>
                    <input type="text" id="country" th:field="*{address.country}">
                    <p class="field-error" th:if="${#fields.hasErrors('address.country')}"
                       th:errors="*{address.country}"></p>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <th:block th:if="${customer.id} == null" th:replace="~{fragments/layout :: icon-plus}"></th:block>
                <th:block th:unless="${customer.id} == null" th:replace="~{fragments/layout :: icon-check}"></th:block>
                <span th:text="${customer.id} == null ? 'Create customer' : 'Save changes'">Create customer</span>
            </button>
            <a class="btn btn-quiet"
               th:href="${customer.id} == null ? @{/customers} : @{/customers/{id}(id=${customer.id})}">Cancel</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
