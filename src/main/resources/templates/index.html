<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('')}"></header>

<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">
    <div class="page-head">
        <h1>Dashboard</h1>
    </div>

    <div class="tiles">
        <a class="tile" th:href="@{/products}">
            <div class="tile-icon"><span th:replace="~{fragments/layout :: badge-product}"></span></div>
            <div class="tile-label">Products</div>
            <div class="tile-value" th:text="${productCount}">0</div>
        </a>
        <a class="tile" th:href="@{/orders}">
            <div class="tile-icon"><span th:replace="~{fragments/layout :: badge-order}"></span></div>
            <div class="tile-label">Orders</div>
            <div class="tile-value" th:text="${orderCount}">0</div>
        </a>
        <a class="tile" th:href="@{/customers}">
            <div class="tile-icon"><span th:replace="~{fragments/layout :: badge-customer}"></span></div>
            <div class="tile-label">Customers</div>
            <div class="tile-value" th:text="${customerCount}">0</div>
        </a>
    </div>

    <div class="panel">
        <h2>Getting started</h2>
        <p class="muted" style="margin-top:0">
            Business requirements are still being defined, so this is a deliberately plain
            CRUD skeleton over the three core entities. Each area supports list, search,
            create, view, edit and delete.
        </p>
        <div class="form-actions" style="border-top:0; padding-top:0; margin-top:14px">
            <a class="btn btn-primary" th:href="@{/orders/new}">
                <th:block th:replace="~{fragments/layout :: icon-plus}"></th:block> New order</a>
            <a class="btn" th:href="@{/products/new}" sec:authorize="hasRole('ADMIN')">
                <th:block th:replace="~{fragments/layout :: icon-plus}"></th:block> New product</a>
            <a class="btn" th:href="@{/customers/new}" sec:authorize="hasRole('ADMIN')">
                <th:block th:replace="~{fragments/layout :: icon-plus}"></th:block> New customer</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
