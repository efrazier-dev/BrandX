# Local development: in-memory H2, schema generated by Hibernate, demo data seeded,
# templates reloaded on change, H2 web console available.
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    # Off so template edits show up on refresh without restarting.
    cache: false

  h2:
    console:
      enabled: true
      path: /h2-console

brandx:
  seed-data: true

logging:
  level:
    com.brandx: DEBUG
    # Uncomment to inspect the generated SQL, e.g. to confirm the order list is not
    # issuing one query per row:
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
