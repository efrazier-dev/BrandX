# MySQL profile.
#
#   ./mvnw -Pmysql spring-boot:run -Dspring-boot.run.profiles=mysql
#
# The -Pmysql Maven profile puts the JDBC driver on the classpath; this file supplies
# the connection. Override any value with the matching env var.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/brandx}
    username: ${DB_USERNAME:brandx}
    password: ${DB_PASSWORD:brandx}

  jpa:
    hibernate:
      # See the note in application-postgres.yml: no Hibernate DDL against a shared
      # database; switch to Flyway when the schema settles.
      ddl-auto: ${DDL_AUTO:validate}

brandx:
  seed-data: false
